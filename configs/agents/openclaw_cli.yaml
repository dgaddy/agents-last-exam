# openclaw_cli — official OpenClaw CLI with a task-local gateway.
# CUA bridge is the native OpenClaw plugin (not MCP).
#   provider=openrouter → OPENROUTER_API_KEY (model prefixed openrouter/<model>);
#   provider=direct → OPENAI_API_KEY (gpt-*) or ANTHROPIC_API_KEY (claude-*).
#   provider=zai → ZAI_API_KEY / Z_AI_API_KEY (model prefixed zai/<model>).
#
# Consolidated preset; `model:` is an example, every `config:` key is the
# dataclass default (ale_run/agents/openclaw_cli/config.py).
# Reference as:  agents: [ configs/agents/openclaw_cli.yaml ]

harness: openclaw_cli
# executor: sandbox          # only supported value (deployer default).

# Example model — sugar for config.model. Dataclass default: openai/gpt-5.4.
model: openai/gpt-5.4

config:
  # Exact official npm version; a custom tarball must have the same version.
  cli_version: "2026.10.5"
  # Routing: "openrouter" (default), "direct" (provider picked by model vendor),
  # "zai" (validated with GLM-5.2), or "custom" (validated with an Azure
  # OpenAI-compatible endpoint).
  provider: openrouter

  # Custom OpenAI-compatible base URL → written to openclaw.json
  # models.providers.<provider>.baseUrl (+ a model catalog entry). null = the
  # provider's built-in default. For an OpenAI-compatible gateway like Volcengine
  # Ark, use provider=direct + model: openai/<id> + base_url:
  # https://ark.cn-beijing.volces.com/api/v3 (the openai provider sends the bare
  # model id; the openrouter provider would keep an openrouter/ prefix Ark rejects).
  base_url: null

  # Literal API key for base_url, carried via config (use `api_key: ${env:YOUR_KEY}`,
  # resolved host-side → travels with the serialized config, no env-passthrough
  # whitelist change, no clash with a real OPENROUTER_API_KEY). null = read the
  # provider's env var. When set, used directly in auth-profiles.json.
  api_key: null

  # Provider-specific primary-model parameters. `extra_body` is merged into
  # the OpenAI-compatible request body.
  model_params: null

  # Request token usage in streamed responses. Disable only for an endpoint
  # that rejects stream_options.include_usage.
  supports_usage_in_streaming: true

  # OpenClaw's OWN internal run budget (openclaw.json timeoutSeconds +
  # `agent --timeout <s>`). Distinct from the orchestration episode budget.
  agent_timeout_s: 600

  # Thinking level. Common values: off | on | minimal | low | medium | high |
  # xhigh | max. OpenClaw validates provider-specific support at launch.
  thinking: high

  # Vision/screenshot model. null = none; default pins it to the same id as model.
  vision_model: openai/gpt-5.4

  # Separate vision routing. null inherits the primary route.
  vision_provider: null
  vision_base_url: null
  vision_api_key: null

  # Leave these empty to use OpenClaw's default tools and plugins.
  tools_deny: []
  plugins_allow: []

  # Null uses OpenClaw's default heartbeat cadence.
  heartbeat_every: null

  # Plugins explicitly denied. Default: none.
  plugins_deny: []

  # Optional custom package. Empty uses the official npm package.
  tarball_path: ""

  # Optional tarball URL, used when tarball_path is empty or missing.
  tarball_url: ""

  # CUA plugin source dir inside the sandbox.
  cua_plugin_path: /opt/ale/openclaw-cua-plugin

  # Git URL to clone the CUA plugin from when cua_plugin_path is missing.
  cua_plugin_repo: https://github.com/cua-verse/openclaw.git

  # Branch to clone for the CUA plugin source.
  cua_plugin_branch: agenthle
